<!DOCTYPE html>
<html>
<head>
  <title>Random Dog</title>
</head>
<body>

<h1>Random Dog 🐶</h1>

<img id="dogImage" width="300">

<script>
fetch("https://dog.ceo/api/breeds/image/random")
  .then(response => response.json())
  .then(data => {
    document.getElementById("dogImage").src = data.message;
  })
  .catch(error => console.error(error));
</script>

</body>
</html>
