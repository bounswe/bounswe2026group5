[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["venv", ".venv", "migrations"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests.py"]

[tool.coverage.report]
omit = ["*/migrations/*", "*/tests.py"]
