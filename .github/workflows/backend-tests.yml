name: Backend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "scripts/ci/backend_*"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "scripts/ci/backend_*"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  backend:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mentorship_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d mentorship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/mentorship_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run migrations
        run: python manage.py migrate
        working-directory: backend

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage json -o coverage.json
          coverage report
        working-directory: backend

      - name: Add backend coverage to job summary
        if: always()
        run: python scripts/ci/backend_coverage_summary.py
