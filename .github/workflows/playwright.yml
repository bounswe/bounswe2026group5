name: Playwright Tests
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up environment variables
      env:
        BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        # Root .env for Docker Compose
        cp .env.example .env
        
        # Backend .env and credentials
        mkdir -p backend/credentials
        if [ -n "$BACKEND_ENV" ]; then
          echo "$BACKEND_ENV" > backend/.env
        else
          cp backend/.env.example backend/.env
        fi
        
        if [ -n "$GCP_SERVICE_ACCOUNT" ]; then
          printf "%s" "$GCP_SERVICE_ACCOUNT" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > backend/credentials/service-account.json
        fi
        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > backend/credentials/firebase-service-account.json
        fi
        
        # Mobile configuration
        if [ -n "$MOBILE_ENV" ]; then
          echo "$MOBILE_ENV" > mobile/.env
        fi
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf "%s" "$GOOGLE_SERVICES_JSON" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > mobile/google-services.json
        fi
      working-directory: .
      
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: web/playwright-report/
        retention-days: 30
