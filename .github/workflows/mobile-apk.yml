name: Mobile APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write mobile env file
        run: |
          if [ -n "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" > .env
          else
            echo "EXPO_PUBLIC_API_BASE_URL=http://127.0.0.1:8000" > .env
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
