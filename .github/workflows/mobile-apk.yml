name: Mobile APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://neighborship.app

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write mobile env file
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          # Start with the secret if it exists
          if [ -n "$MOBILE_ENV" ]; then
            echo "$MOBILE_ENV" > .env
          else
            touch .env
          fi
          
          # Force the production API URL for this build
          # This ensures that even if MOBILE_ENV contains a local IP or localhost,
          # the final APK points to the live app.
          sed -i '/EXPO_PUBLIC_API_BASE_URL/d' .env
          echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL" >> .env
          
          echo "Final .env content (obfuscated):"
          sed 's/=.*/=*** /' .env

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf "%s" "$GOOGLE_SERVICES_JSON" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > google-services.json
          fi

      - name: Decode Android Keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > android-release-key.jks
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret is missing. APK will be unsigned."
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build and Sign release APK
        env:
          # Pass signing credentials to Gradle via environment variables
          MYAPP_RELEASE_STORE_FILE: ../android-release-key.jks
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'c9d0f89b48ef1501cfba73b068b77040' }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          chmod +x android/gradlew
          cd android
          # We pass the signing properties directly to the assembleRelease command
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$MYAPP_RELEASE_STORE_FILE \
            -Pandroid.injected.signing.store.password=$MYAPP_RELEASE_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$MYAPP_RELEASE_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$MYAPP_RELEASE_KEY_PASSWORD \
            -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Prepare universal APK
        run: |
          mkdir -p apk-out
          UNIVERSAL_APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "apk-out/Neighborship.apk"
          else
            echo "Expected release APK not found under android/app/build/outputs/apk/release"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-release
          path: mobile/apk-out/*.apk
          if-no-files-found: error
          retention-days: 14
