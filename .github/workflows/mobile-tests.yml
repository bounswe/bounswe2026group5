name: Mobile Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - "scripts/ci/mobile_*"
      - ".github/workflows/mobile-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - "scripts/ci/mobile_*"
      - ".github/workflows/mobile-tests.yml"
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Run tests with coverage
        run: npm run test -- --coverage --coverageReporters=json-summary --coverageReporters=text
        working-directory: mobile

      - name: Add mobile coverage to job summary
        if: always()
        run: node scripts/ci/mobile_coverage_summary.js
