name: Frontend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "web/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "web/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Run tests
        run: npm run test
        working-directory: web
