name: Frontend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "web/**"
      - "scripts/ci/frontend_*"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "web/**"
      - "scripts/ci/frontend_*"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up environment variables
        env:
          ROOT_ENV: ${{ secrets.ROOT_ENV }}
        run: |
          if [ -n "$ROOT_ENV" ]; then
            echo "$ROOT_ENV" > .env
          else
            cp .env.example .env
          fi
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Run tests with coverage
        run: npm run test -- --coverage --coverage.reporter=json-summary --coverage.reporter=text
        working-directory: web

      - name: Add frontend coverage to job summary
        if: always()
        run: node scripts/ci/frontend_coverage_summary.js
