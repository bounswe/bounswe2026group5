server {
    listen 80;
    server_name neighborship.app www.neighborship.app;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name neighborship.app www.neighborship.app;

    ssl_certificate /etc/letsencrypt/live/neighborship.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neighborship.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:3000; # Frontend servis adın ve portun
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
