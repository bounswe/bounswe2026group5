# Redirect all HTTP traffic to HTTPS non-www
server {
    listen 80;
    server_name neighborship.app www.neighborship.app;
    return 301 https://neighborship.app$request_uri;
}

# Redirect HTTPS www to HTTPS non-www
server {
    listen 443 ssl;
    server_name www.neighborship.app;

    ssl_certificate /etc/letsencrypt/live/neighborship.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neighborship.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://neighborship.app$request_uri;
}

# Main Production Server (HTTPS non-www)
server {
    listen 443 ssl;
    server_name neighborship.app;

    ssl_certificate /etc/letsencrypt/live/neighborship.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neighborship.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # iOS Universal Links & Android App Links
    location /.well-known/ {
        alias /etc/nginx/.well-known/;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
